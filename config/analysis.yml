project:
  genome_build: "GRCh38"
  raw_dir: "raw_data"
  outcome_dir: "outcome_data"
  output_dir: "outputs"
  figure_dir: "outcome_figures"
  traits_file: "config/traits.tsv"
  cell_types_file: "config/cell_types.tsv"

primary_comparison:
  graves: "E4_GRAVES_STRICT"
  autoimmune_hypothyroidism: "E4_HYTHY_AI_STRICT"

gwas_qc:
  genome_wide_p: 5.0e-8
  suggestive_p: 1.0e-5
  cross_trait_support_p: 0.05
  maf_min_general: 0.005
  maf_min_ld_methods: 0.01
  locus_half_window_bp: 500000
  autosomes_only: true
  remove_palindromic_for_ld_methods: true

hla:
  chromosome: 6
  start: 25000000
  end: 34000000
  analyze_separately: true

multiome:
  release: "v1"
  donor_n_default: 1108
  qtl_fdr: 0.05
  minimum_shared_snps: 50
  use_significant_qtl_features_only: true

coloc:
  p1: 1.0e-4
  p2: 1.0e-4
  p12: 1.0e-5
  pp_h4_report: 0.50
  pp_h4_strong: 0.80
  minimum_gwas_maf: 0.005
  maximum_features_per_locus: 5000
  workers_default: 4
  hla_workers: 1

t06_gwas_gwas_coloc:
  # The primary prior matches the project-wide coloc setting. FinnGen's
  # coloc.susie.direct default p12 is retained as a prior-sensitivity analysis.
  primary_p12: 1.0e-5
  sensitivity_p12: 5.0e-6
  min_cs_log10bf: 0.9
  min_probmass_core: 0.9
  min_probmass_suggestive: 0.5
  strong_h4: 0.80
  suggestive_h4: 0.50
  distinct_h3: 0.80

t10_qtl_susie_coloc:
  # Direct signal-pair confirmation of the regional R13 coloc.abf screen.
  # The two p12 values mirror T06 so confirmation is prior-robust.
  primary_p12: 1.0e-5
  sensitivity_p12: 5.0e-6
  minimum_shared_snps: 50
  min_gwas_cs_log10bf: 0.9
  min_probmass_core: 0.9
  min_probmass_suggestive: 0.5
  strong_h4: 0.80
  suggestive_h4: 0.50
  distinct_h3: 0.80

t07_five_classification:
  # A shared signal must pass the T06 quality filters and remain above the
  # posterior threshold under both p12 priors. Disease-predominant labels use
  # H3 as the conservative classification posterior, never a one-trait P value.
  classification_posterior: 0.80
  block_suggestive_h4: 0.50
  equivalence_alpha: 0.05
  equivalence_or_upper_primary: 1.10
  equivalence_or_upper_sensitivity: [1.05, 1.15]
  case_difference_p: 5.0e-8

targeted_susie:
  # Step 09 converts the R13 coloc screen into an auditable, chromosome-level
  # Multiome SUSIE.snp acquisition plan. The acquisition script remains a
  # dry-run unless --run is supplied explicitly.
  manifest: "raw_data/manifests/finngen_multiome_v1.manifest.tsv"
  public_base_url: "https://storage.googleapis.com/finngen-public-data-multiome"
  output_dir: "outcome_data/targeted_susie"
  qtl_credible_sets_min: 2
  region_padding_bp: 0
  tabix_cache_mb: 64
  default_max_priority: "P1_strong"

ldsc:
  # User-level Python 3 LDSC installation (CBIIT ldsc39 branch).
  ldsc_dir: "software/ldsc39"
  python: "software/ldsc39-venv/bin/python"
  reference_build: "GRCh37"
  reference_ld_prefix: "raw_data/reference_panels/ldsc/LDscore/LDscore."
  regression_weight_prefix: "raw_data/reference_panels/ldsc/1000G_Phase3_weights_hm3_no_MHC/weights.hm3_noMHC."
  hapmap3_snplist: "raw_data/reference_panels/ldsc/w_hm3.snplist"

lava:
  # Record the reference build for provenance. The generated LAVA locus file
  # contains rsID lists, so LAVA ignores locus coordinates; if SNPS is removed,
  # this build must match GRCh38. The sample-overlap matrix should be derived
  # from cross-trait LDSC because the endpoints share many controls.
  reference_prefix: "raw_data/reference_panels/lava/EUR/EUR"
  reference_build: "GRCh37"
  sample_overlap_file: "outcome_data/lava/input/sample.overlap.txt"
  univariate_familywise_alpha: 0.05

path_b_power:
  # CC-GWAS documentation recommends zero confirmed control overlap when the
  # exact overlap count is unknown. The LDSC-derived value is sensitivity-only.
  genome_wide_alpha: 5.0e-8
  power_targets: [0.80, 0.90]
  maf_values: [0.005, 0.01, 0.02, 0.05, 0.10, 0.20, 0.30, 0.50]
  primary_error_correlation: 0.0
  use_ldsc_overlap_proxy_sensitivity: true
  effect_retention_sensitivity: [1.0, 0.9, 0.8]
  equivalence_alpha: 0.05
  equivalence_or_upper_primary: 1.10
  equivalence_or_upper_sensitivity: [1.05, 1.15]

ccgwas:
  # Official implementation pinned locally for the T04B summary-statistic
  # case-case sensitivity analysis. The Git commit is also written to the
  # scenario manifest at run time.
  source_dir: "software/CCGWAS"
  r_library: "software/R_library"
  hapmap3_snplist: "raw_data/reference_panels/ldsc/w_hm3.snplist"
  output_dir: "outcome_data/ccgwas"
  m_effective_loci: 1000
  input_maf_min: 0.01
  subtype_data: false
  prevalence:
    graves: {main: 0.01, low: 0.005, high: 0.02}
    aiht: {main: 0.05, low: 0.02, high: 0.10}
  # Unknown confirmed overlap is zero in the primary analysis, as required by
  # the CC-GWAS documentation. The other fractions are exploratory bounds.
  overlap_fraction_sensitivity: [0.0, 0.5, 1.0]
  # Candidate-level directional sensitivity only. These values represent
  # hypothetical nondifferential attenuation of a case-control effect.
  contamination_fraction_sensitivity: [0.0, 0.05, 0.10, 0.20]

optional_annotations:
  # Optional two-column table: gene_id, gene_symbol.
  gene_map_tsv: ""
  # Reserved for later data batches.
  gtex_thyroid_eqtl: ""
  hypothyroidism_2025_gwas: ""
  cis_pqtl: ""
  finngen_phewas: ""
